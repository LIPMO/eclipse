# Compile le launcher ECLIPSE (Windows + Linux), le signe et le publie sur GitHub Releases.
# Se lance tout seul quand le dossier launcher/ change sur main : si la version de launcher/package.json n'est pas
# encore publiée, elle est compilée et publiée. Aussi avec une étiquette « launcher-v<version> » ou à la main (onglet Actions).
#
# Signature :
#  - Toujours : attestation de provenance signée par GitHub (Sigstore) + empreintes SHA-256 (SHA256SUMS.txt).
#    Vérification : gh attestation verify ECLIPSE-Launcher-Setup.exe -R LIPMO/eclipse
#  - Signature Windows (Authenticode) gratuite par SignPath Foundation (voir CODE_SIGNING_POLICY.md), active dès que
#    le secret SIGNPATH_API_TOKEN et la variable SIGNPATH_ORGANIZATION_ID existent dans le dépôt. Chaque demande de
#    signature attend l'approbation manuelle sur signpath.io (jusqu'à 1 h). Sans eux : publication non signée.
name: Launcher
on:
  push:
    branches: [main]
    paths: ['launcher/**', '.github/workflows/launcher.yml']
    tags: ['launcher-v*']
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
  attestations: write
concurrency: launcher-release
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./launcher/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "launcher-v$VERSION" -R "${{ github.repository }}" >/dev/null 2>&1 && [ "${{ github.event_name }}" = "push" ]; then
            echo "La version $VERSION est déjà publiée : rien à faire (change la version dans launcher/package.json pour publier)."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.publish == 'true'
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      SIGNPATH_ENABLED: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    defaults:
      run:
        working-directory: launcher
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - run: npm ci
      - name: Syntaxe
        run: for f in main.js preload.js renderer/*.js; do node --check "$f"; done
      - name: Compilation Windows (installateur + portable)
        if: runner.os == 'Windows'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win --publish never
      - name: Fichiers Windows à signer
        id: unsigned
        if: runner.os == 'Windows' && env.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: non-signe-windows
          if-no-files-found: error
          path: |
            launcher/dist/ECLIPSE-Launcher-Setup.exe
            launcher/dist/ECLIPSE-Launcher-Portable.exe
      - name: Signature Windows gratuite (SignPath Foundation)
        if: runner.os == 'Windows' && env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          connector-url: https://githubactions.signpath.io
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: eclipse
          signing-policy-slug: release-signing
          artifact-configuration-slug: launcher-windows
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: launcher/dist-signed
      - name: Fichiers signés à la place des fichiers non signés
        if: runner.os == 'Windows' && env.SIGNPATH_ENABLED == 'true'
        run: |
          cp -f dist-signed/*.exe dist/
          node scripts/update-latest-yml.cjs dist
          rm -f dist/*.blockmap
      - name: Compilation Linux (AppImage)
        if: runner.os == 'Linux'
        run: npx electron-builder --linux --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ runner.os }}
          if-no-files-found: error
          path: |
            launcher/dist/*.exe
            launcher/dist/*.AppImage
            launcher/dist/*.yml
            launcher/dist/*.blockmap

  release:
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: launcher-*
          merge-multiple: true
      - name: Empreintes SHA-256
        working-directory: out
        run: |
          rm -f builder-debug.yml
          sha256sum *.exe *.AppImage > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Attestation de provenance signée (Sigstore)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            out/*.exe
            out/*.AppImage
      - name: Publication sur GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' && 'oui' || 'non' }}
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          ATTR=""; if [ "$SIGNED" = "oui" ]; then ATTR="Free code signing provided by SignPath.io, certificate by SignPath Foundation (CODE_SIGNING_POLICY.md)"; fi
          TAG="launcher-v$VERSION"
          NOTES="ECLIPSE Launcher $VERSION

          Télécharger : https://eclipseee.online/telecharger

          - Windows : ECLIPSE-Launcher-Setup.exe (installation en un clic, mises à jour automatiques) ou ECLIPSE-Launcher-Portable.exe
          - Linux : ECLIPSE-Launcher.AppImage

          Compilé par GitHub Actions à partir de ce dépôt. Attestation de provenance signée : gh attestation verify <fichier> -R ${{ github.repository }}
          Signature Windows (Authenticode) : $SIGNED
          $ATTR
          Empreintes : SHA256SUMS.txt"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* --target "$GITHUB_SHA" --title "ECLIPSE Launcher $VERSION" --notes "$NOTES" --latest
          fi
